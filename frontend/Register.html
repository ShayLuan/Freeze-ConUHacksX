<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login-Register</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Exo+2:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Jost:ital,wght@0,100..900;1,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link type="text/css" rel="stylesheet" href="Register.css" />
  </head>

  <body class="registerpage">
    <header class="nav_bar_register">
      <nav>
        <a href="index.html">Home</a>
      
      </nav>
    </header>

    <main class= "auth-container">
      <section id="login-frame"> 
        <h1>Login To Your Account</h1>
        <!-- INCORRECT PASSWORD OR E-MAIL WARNING -->
        <p id="errorMsg" style="color: red; display: none; margin-bottom: 10px;">
          Incorrect email or password.
        </p>

        <form action="/Login" method="POST" id="login-form">
          <label for="login-email"></label>
          <input
            type="email"
            id="login-email"
            name="email"
            placeholder="Email Address"
            required
          />
          
          <label for="login-password"></label>
          <input
            type="password"
            id="login-password"
            name="password"
            placeholder="Password"
            required
          />

          <button type="submit" class="button">Log in</button>
        </form>
        <p id="login-error" style="color: #c0392b; margin-top: 8px;"></p>

        
          <a id="forgot-password" href="ForgotPassword.html"
            >Forgot password?</a
          >
    
      </section>
      <section id="register-frame">
        <h1>Create Your Account</h1>
        <form action="/Register" method="POST" id="register-form">
          <label for="name">Username</label>
          <input type="text" id="name" name="name"  />

          <label for="email">Email Address</label>
          <input type="email" id="email" name="email"  />

          <label for="password">Password</label>
          <input type="password" id="password" name="password"  />

          <label for="confirm-password">Confirm Password</label>
          <input
            type="password"
            id="confirm-password"
            name="confirm-password"
            required
          />

          <button type="submit" class="button">Register</button>
        </form>
        <p id="register-error" style="color: #c0392b; margin-top: 8px;"></p>

      
      </section>
    </main>

    <footer>
      

    </footer>
    <script type="text/javascript" src="Register.js" ;></script>
  </body>
</html>
