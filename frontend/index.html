<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freeze | Preserve Your Moments</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Background Image with Frost Overlay -->
    <div class="background-container">
        <div class="background-image"></div>
        <div class="frost-overlay"></div>
    </div>
    
    <!-- Snow Animation -->
    <div class="snow-container">
        <div class="snowflake">❄</div>
        <div class="snowflake">❄</div>
        <div class="snowflake">❄</div>
        <div class="snowflake">❄</div>
        <div class="snowflake">❄</div>
        <div class="snowflake">❄</div>
        <div class="snowflake">❄</div>
        <div class="snowflake">❄</div>
        <div class="snowflake">❄</div>
        <div class="snowflake">❄</div>
    </div>
    
    <!-- Main Content Container -->
    <div class="container">
        <!-- Header - Logo Only -->
        <header class="header">
            <div class="logo">
                <i class="fas fa-snowflake"></i>
                <span>FREEZE</span>
            </div>
        </header>

        <!-- Hero Section -->
        <main class="hero">
            <div class="main-text-container">
                <h1 class="main-title">
                    <span>FREEZE</span>
                </h1>
                <div class="subtitle-container">
                    <i class="fas fa-quote-left quote-icon"></i>
                    <p class="subtitle">
                        <span id="typing-text"></span>
                        <span class="cursor">|</span>
                    </p>
                    <i class="fas fa-quote-right quote-icon"></i>
                </div>
            </div>

            <!-- Login/Signup Buttons (Replaced CTA) -->
            <div class="auth-container">
                <a href="Register.html" class="auth-action-btn login-action-btn">
                    <i class="fas fa-sign-in-alt"></i>
                    Login to Your Memories
                </a>
                
            </div>
        </main>

        <!-- Polaroid Timeline Section -->
        <section class="timeline-section">
            <div class="section-header">
                <h2>"Some memories are worth freezing in time"</h2>
                <p>Scroll through precious moments captured forever</p>
            </div>
            
            <div class="polaroid-timeline" id="polaroidTimeline">
                <!-- Polaroids will be generated by JavaScript -->
            </div>
            
            <!-- Timeline Navigation -->
            <div class="timeline-nav">
                <button class="timeline-nav-btn prev-btn">
                    <i class="fas fa-chevron-left"></i>
                </button>
                <div class="timeline-dots">
                    <!-- Dots will be generated by JavaScript -->
                </div>
                <button class="timeline-nav-btn next-btn">
                    <i class="fas fa-chevron-right"></i>
                </button>
            </div>
        </section>

        <!-- Footer -->
        <footer class="footer">
            <div class="footer-content">
                <div class="footer-logo">
                    <i class="fas fa-snowflake"></i>
                    <span>FREEZE</span>
                </div>
                <p class="footer-tagline">Preserving your precious moments forever</p>
                <div class="footer-links">
                    <a href="#" class="footer-link">Privacy Policy</a>
                    <a href="#" class="footer-link">Terms of Service</a>
                    <a href="#" class="footer-link">Contact Us</a>
                </div>
                <p class="copyright">© 2024 Freeze. All memories preserved.</p>
            </div>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
